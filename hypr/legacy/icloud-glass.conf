# icloud-glass.conf — reglas de Hyprland en hyprlang (sintaxis clásica
# `.conf`) para el panel icloud-glass (Quickshell).
#
# ##############################################################################
# #  DEPRECADO. Solo para Hyprland <= 0.54.                                   #
# #                                                                            #
# #  Hyprland 0.55 (mayo 2026) migró su configuración de hyprlang a Lua.      #
# #  Si existe `~/.config/hypr/hyprland.lua`, hyprlang NI SIQUIERA SE CARGA:  #
# #  este archivo sería ignorado por completo. Y hyprlang se elimina del      #
# #  proyecto en 1-2 releases tras esa migración, así que este .conf dejará   #
# #  de funcionar del todo muy pronto.                                        #
# #                                                                            #
# #  Usa en su lugar `hypr/.config/hypr/lua/icloud-glass.lua`                 #
# #  (`require("lua.icloud-glass")` desde tu `hyprland.lua`) salvo que estés  #
# #  atado a una versión vieja de Hyprland que aún no soporte Lua.            #
# ##############################################################################
#
# Cómo activarlo (solo Hyprland <= 0.54, sin hyprland.lua):
#   source = ~/hypr/legacy/icloud-glass.conf
# añadido a tu ~/.config/hypr/hyprland.conf.
#
# Namespace real del panel: ver el comentario detallado en
# hypr/.config/hypr/lua/icloud-glass.lua y en
# quickshell/.config/quickshell/icloud-glass/components/GlassPanel.qml.
# El namespace efectivo que ve Hyprland es `quickshell:icloud-glass...`.

# Blur + ignorealpha (equivalente hyprlang de ignore_alpha) para que el
# shader de GlassSurface.qml no recorte el blur del compositor. La
# animación de apertura/cierre la hace el QML, así que se desactiva la del
# compositor con noanim.
layerrule = blur, ^quickshell:icloud-glass
layerrule = ignorealpha 0.15, ^quickshell:icloud-glass
layerrule = noanim, ^quickshell:icloud-glass

# SUPER + C: abre/cierra el panel (IpcHandler target "panel", ver
# docs/CONTRACTS.md sección 6).
bind = SUPER, C, exec, qs -c icloud-glass ipc call panel toggle

# Autostart del shell de Quickshell como daemon.
exec-once = qs -c icloud-glass -d
